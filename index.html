<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alice's Flowers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: portada con el logo, tarjetas de categoría en rosa pastel y galerías de fotos. Un solo botón de WhatsApp por categoría. */
:root {
  --bg: #fff5f8;
  --bg-2: #fde7ee;
  --card: #ffffff;
  --rosa: #f6cfdb;
  --rosa-fuerte: #e59db4;
  --dorado: #a37a22;
  --dorado-claro: #e4c777;
  --dorado-medio: #c9a24e;
  --texto: #5b3a45;
  --texto-suave: #8a6672;
  --font: "Times New Roman", Times, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--texto);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.5;
  padding-block: 28px 100px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Encabezado */
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-block: 4px 22px; }
.logo { width: min(270px, 72%); display: grid; place-items: center; }
.logo img { width: 100%; height: auto; display: block; }
.logo svg { width: 45%; max-width: 110px; }
.hero .eslogan { color: var(--texto-suave); font-style: italic; font-size: 1.15rem; margin-top: 6px; }
.pill {
  display: inline-block; color: var(--dorado); background: var(--card);
  border: 1.5px solid var(--dorado-medio); border-radius: 999px;
  padding: 3px 16px; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.filete { width: 120px; height: 2px; background: linear-gradient(90deg, transparent, var(--dorado-medio), transparent); border: 0; margin: 0 auto 24px; }

/* Portada: categorías */
.titulo-seccion { text-align: center; font-size: 1.5rem; margin-bottom: 6px; }
.guia { text-align: center; color: var(--texto-suave); font-style: italic; max-width: 46ch; margin: 0 auto 22px; }
.cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.cat {
  flex: 0 0 calc(50% - 9px); min-width: 0;
  color: inherit; text-decoration: none; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--rosa); border-radius: 18px; overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.cat:hover { transform: translateY(-3px); border-color: var(--dorado-medio); box-shadow: 0 8px 22px rgba(201, 162, 78, .25); }
.cat .foto { aspect-ratio: 4 / 5; }
.cat .foto img { object-position: center 35%; }
.cat .info { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cat h3 { font-size: 1.15rem; color: var(--dorado); }
.cat p { color: var(--texto-suave); font-size: .98rem; flex: 1; }
.cat .desde { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
.cat .ver { font-size: .95rem; border-top: 1px solid var(--rosa); padding-top: 8px; margin-top: 6px; }
@media (min-width: 720px) { .cat { flex-basis: calc(33.333% - 12px); } .cat h3 { font-size: 1.25rem; } }

/* Foto o marcador */
.foto { width: 100%; background: linear-gradient(160deg, var(--rosa), var(--bg-2)); display: grid; place-items: center; overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto svg { width: 38%; max-width: 110px; opacity: .9; }

/* Vista de categoría */
.volver {
  display: inline-block; text-decoration: none; color: var(--dorado); background: var(--card);
  border: 1.5px solid var(--dorado-medio); border-radius: 999px; padding: 8px 18px; font-size: 1rem; margin-bottom: 18px;
}
.volver:hover { background: var(--bg-2); }
.cab-cat { text-align: center; margin-bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cab-cat h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--dorado); }
.cab-cat .texto { max-width: 62ch; color: var(--texto); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 18px; }
.chip {
  appearance: none; font: inherit; font-size: 1rem; cursor: pointer; color: var(--texto);
  background: var(--card); border: 1.5px solid var(--rosa-fuerte); border-radius: 999px; padding: 7px 16px;
}
.chip:hover { background: var(--bg-2); border-color: var(--dorado-medio); }
.aviso {
  background: var(--bg-2); border: 1.5px dashed var(--dorado-medio); border-radius: 16px;
  padding: 16px 18px; margin-bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.aviso p { max-width: 52ch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer;
  font: inherit; font-weight: 700; font-size: 1.05rem; color: #3f2a10;
  background: linear-gradient(135deg, var(--dorado-claro), var(--dorado-medio));
  border: 0; border-radius: 999px; padding: 12px 24px;
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

/* Galería */
.galeria { column-count: 2; column-gap: 14px; }
@media (min-width: 720px) { .galeria { column-count: 3; } }
.ph {
  display: block; width: 100%; margin: 0 0 14px; padding: 0; cursor: zoom-in;
  border: 1.5px solid var(--rosa); border-radius: 16px; overflow: hidden; background: var(--card);
  break-inside: avoid;
}
.ph img { display: block; width: 100%; height: auto; }
.seccion { margin-top: 30px; scroll-margin-top: 16px; }
.seccion h3 { font-size: 1.5rem; color: var(--dorado); text-align: center; }
.sec-desc { text-align: center; color: var(--texto-suave); font-style: italic; margin: 4px auto 14px; max-width: 52ch; }
.vacio { text-align: center; color: var(--texto-suave); font-style: italic; padding: 18px 0 8px; max-width: 46ch; margin: 0 auto; }

/* Visor de foto */
.visor {
  position: fixed; inset: 0; z-index: 20; background: rgba(70, 35, 48, .92);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.visor img { max-width: 100%; max-height: 74vh; object-fit: contain; border-radius: 12px; }
.visor p { color: #fff5f8; text-align: center; font-size: 1rem; max-width: 40ch; }
.cerrar {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  appearance: none; font: inherit; font-size: 1.1rem; cursor: pointer; color: #3f2a10;
  background: linear-gradient(135deg, var(--dorado-claro), var(--dorado-medio)); border: 0; border-radius: 999px; padding: 8px 18px;
}

a:focus-visible, button:focus-visible { outline: 3px solid var(--dorado); outline-offset: 3px; }

/* Botón flotante y pie */
.flotante {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 5; box-shadow: 0 6px 18px rgba(120, 80, 20, .3);
}
footer { text-align: center; color: var(--texto-suave); font-size: .95rem; margin-top: 40px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo" id="logo"></div>
    <h1 class="sr" id="nombre"></h1>
    <p class="eslogan" id="eslogan"></p>
  </header>
  <hr class="filete">
  <main id="vista"></main>
  <footer id="pie"></footer>
</div>
<a class="btn flotante" id="flotante" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>

<div class="visor" id="visor" hidden>
  <button class="cerrar" id="cerrar" type="button">Cerrar ✕</button>
  <img id="visor-img" alt="">
  <p>Toma una captura de pantalla de esta foto y envíala por WhatsApp. Te cotizamos.</p>
</div>

<script>
/* =====================================================
   EDITA AQUÍ  (solo esta parte, lo demás no se toca)
   ===================================================== */
const NEGOCIO = {
  nombre: "Alice's Flowers",
  eslogan: "Detalles hechos con amor",
  whatsapp: "50200000000",          // CAMBIA ESTE NÚMERO: tu WhatsApp con código de país, sin + ni espacios (Guatemala = 502)
  logo: "fotos/logo.png",
  precio: "Precios desde Q100",     // aparece solo dentro de cada categoría (como "Desde Q100")
  pie: "Pedidos y cotizaciones por WhatsApp"
};

/* CÓMO AGREGAR UNA FOTO
   1) Sube la foto a la carpeta "fotos" de GitHub (nombre sin espacios ni tildes, por ejemplo ramo-10.jpg).
   2) Agrega una línea con su ruta dentro de "fotos", así:  "fotos/ramo-10.jpg",
   Cada categoría tiene su propia lista de fotos. */
const CATEGORIAS = [
  {
    id: "eternas",
    nombre: "Ramos de flores eternas",
    resumen: "Rosas que duran para siempre.",
    descripcion: "Ramos de rosas que no se marchitan y te duran para siempre. Los armamos del tamaño y los colores que tú elijas, y los decoramos con coronas, mariposas, letras, lazos y un mensaje en la cinta. Son ideales para cumpleaños, aniversarios, el Día de la Madre o cualquier ocasión especial.",
    portada: "fotos/eternas-portada.jpg",
    fotos: [
      "fotos/eternas-1.jpg",
      "fotos/eternas-2.jpg",
      "fotos/eternas-3.jpg",
      "fotos/eternas-4.jpg",
      "fotos/eternas-5.jpg",
      "fotos/eternas-6.jpg",
      "fotos/eternas-7.jpg",
      "fotos/eternas-8.jpg",
      "fotos/eternas-9.jpg"
    ]
  },
  {
    id: "arreglos",
    nombre: "Arreglos, cajas y bases",
    resumen: "Cajas y bases con rosas para regalar.",
    descripcion: "Cajas y bases con rosas, listas para regalar: cajas en forma de corazón con chocolates, cajas de regalo con fotos y detalles, y letras armadas con rosas. Dinos para quién es y en qué ocasión, y te lo preparamos.",
    portada: "fotos/arreglos-2.jpg",
    fotos: [
      "fotos/arreglos-1.jpg",
      "fotos/arreglos-2.jpg",
      "fotos/arreglos-3.jpg",
      "fotos/arreglos-4.jpg"
    ]
  },
  {
    id: "personalizados",
    nombre: "Ramos personalizados",
    resumen: "Con peluches, de gomitas, de personajes o de maquillaje.",
    descripcion: "Armamos el ramo que imaginas. Aquí encuentras ramos con peluches, de gomitas, de personajes y de maquillaje. Cuéntanos los colores, el tema, el nombre o el mensaje que quieres, y lo hacemos a tu gusto.",
    portada: "",
    fotos: [],
    /* Cada sección tiene su título, una frase corta y su lista de fotos (por ahora vacías).
       Para agregar fotos, escribe sus rutas dentro de "fotos", por ejemplo:  fotos: ["fotos/peluche-1.jpg"] */
    secciones: [
      { titulo: "Con peluches",   descripcion: "Ramos con peluche, en el tamaño y los colores que prefieras.", fotos: [] },
      { titulo: "De gomitas",     descripcion: "Ramos hechos con gomitas y dulces, con lazos y detalles al gusto.", fotos: [] },
      { titulo: "De personajes",  descripcion: "Ramos decorados con tu personaje favorito.", fotos: [] },
      { titulo: "De maquillaje",  descripcion: "Ramos armados con productos de maquillaje y belleza.", fotos: [] }
    ]
  }

  /* PARA AGREGAR UNA CATEGORÍA NUEVA EN EL FUTURO
     Copia el bloque de abajo (desde la llave { hasta la llave }), quítale los símbolos de comentario,
     pégalo justo arriba de este texto y pon una coma "," después de la llave } de la categoría anterior.
     El "id" debe ir en minúsculas, sin espacios ni tildes.

  ,{
    id: "nueva",
    nombre: "Nombre de la categoría",
    resumen: "Frase corta que sale en la tarjeta.",
    descripcion: "Texto un poco más largo que sale dentro de la categoría.",
    portada: "",
    fotos: []
  }
  */
];

/* =====================================================
   NO NECESITAS TOCAR NADA DESDE AQUÍ
   ===================================================== */
const $ = (id) => document.getElementById(id);
const MENSAJE_GENERAL = "Hola, quiero información y cotizar un pedido.";

const FLOR = '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#f0b5c7"><circle cx="50" cy="26" r="16"/><circle cx="74" cy="44" r="16"/><circle cx="65" cy="72" r="16"/><circle cx="35" cy="72" r="16"/><circle cx="26" cy="44" r="16"/></g><circle cx="50" cy="52" r="12" fill="#e4c777"/></svg>';

function el(tag, clase, texto) {
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto !== undefined) n.textContent = texto;
  return n;
}

function crearFoto(src, alt) {
  const d = el("div", "foto");
  if (src) {
    const img = document.createElement("img");
    img.src = src; img.alt = alt; img.decoding = "async";
    img.onerror = () => { d.innerHTML = FLOR; };
    d.appendChild(img);
  } else {
    d.innerHTML = FLOR;
  }
  return d;
}

function linkWhatsApp(mensaje) {
  return "https://wa.me/" + NEGOCIO.whatsapp + "?text=" + encodeURIComponent(mensaje);
}

function mensajeCategoria(c) {
  return "Hola, quiero cotizar un pedido de la categoría: " + c.nombre + ". Te envío captura de la foto que me gustó.";
}

function primeraFoto(c) {
  if (c.portada) return c.portada;
  if (c.fotos && c.fotos.length) return c.fotos[0];
  const s = (c.secciones || []).find((x) => x.fotos && x.fotos.length);
  return s ? s.fotos[0] : "";
}

/* Visor de foto ampliada */
let focoAnterior = null;
function abrirVisor(src, alt) {
  $("visor-img").src = src;
  $("visor-img").alt = alt;
  $("visor").hidden = false;
  document.body.style.overflow = "hidden";
  focoAnterior = document.activeElement;
  $("cerrar").focus();
}
function cerrarVisor() {
  $("visor").hidden = true;
  $("visor-img").removeAttribute("src");
  document.body.style.overflow = "";
  if (focoAnterior && focoAnterior.focus) focoAnterior.focus();
}

function galeria(fotos, nombre) {
  const g = el("div", "galeria");
  fotos.forEach((src, i) => {
    const b = el("button", "ph");
    b.type = "button";
    b.setAttribute("aria-label", "Ver foto ampliada");
    const img = document.createElement("img");
    img.src = src; img.alt = nombre + ", foto " + (i + 1); img.decoding = "async";
    img.onerror = () => b.remove();
    b.appendChild(img);
    b.addEventListener("click", () => abrirVisor(src, img.alt));
    g.appendChild(b);
  });
  return g;
}

function portada() {
  const v = $("vista");
  v.replaceChildren();
  v.appendChild(el("h2", "titulo-seccion", "Elige una categoría"));
  v.appendChild(el("p", "guia", "Mira las fotos, toma una captura de la que más te guste y envíanosla por WhatsApp. Te cotizamos."));
  const g = el("div", "cats");
  CATEGORIAS.forEach((c) => {
    const a = el("a", "cat");
    a.href = "#" + c.id;
    a.appendChild(crearFoto(primeraFoto(c), c.nombre));
    const info = el("div", "info");
    info.appendChild(el("h3", "", c.nombre));
    info.appendChild(el("p", "", c.resumen));
    info.appendChild(el("span", "desde", NEGOCIO.precio.replace("Precios d", "D")));
    info.appendChild(el("span", "ver", "Ver modelos →"));
    a.appendChild(info);
    g.appendChild(a);
  });
  v.appendChild(g);
}

function categoria(c) {
  const v = $("vista");
  v.replaceChildren();

  const volver = el("a", "volver", "← Todas las categorías");
  volver.href = "#";
  v.appendChild(volver);

  const cab = el("div", "cab-cat");
  cab.appendChild(el("h2", "", c.nombre));
  cab.appendChild(el("span", "pill", NEGOCIO.precio.replace("Precios d", "D")));
  cab.appendChild(el("p", "texto", c.descripcion));
  v.appendChild(cab);

  const secs = c.secciones || [];
  const bloques = [];

  if (secs.length > 1) {
    const chips = el("div", "chips");
    secs.forEach((s, i) => {
      const b = el("button", "chip", s.titulo);
      b.type = "button";
      b.addEventListener("click", () => {
        const suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        bloques[i].scrollIntoView({ behavior: suave ? "smooth" : "auto", block: "start" });
      });
      chips.appendChild(b);
    });
    v.appendChild(chips);
  }

  const aviso = el("div", "aviso");
  const t = el("p");
  t.appendChild(el("strong", "", "¿Te gustó alguno? "));
  t.appendChild(document.createTextNode("Toma una captura de pantalla de la foto y envíanosla por WhatsApp. Te cotizamos."));
  aviso.appendChild(t);
  const a = el("a", "btn", "Ordena aquí por WhatsApp");
  a.href = linkWhatsApp(mensajeCategoria(c));
  a.target = "_blank"; a.rel = "noopener";
  aviso.appendChild(a);
  v.appendChild(aviso);

  const fotos = c.fotos || [];
  if (fotos.length) v.appendChild(galeria(fotos, c.nombre));

  secs.forEach((s) => {
    const sec = el("section", "seccion");
    sec.appendChild(el("h3", "", s.titulo));
    if (s.descripcion) sec.appendChild(el("p", "sec-desc", s.descripcion));
    if (s.fotos && s.fotos.length) {
      sec.appendChild(galeria(s.fotos, c.nombre + " " + s.titulo));
    } else {
      sec.appendChild(el("p", "vacio", "Pronto subiremos fotos de esta sección. Escríbenos y te mostramos las opciones."));
    }
    v.appendChild(sec);
    bloques.push(sec);
  });

  if (!fotos.length && !secs.length) {
    v.appendChild(el("p", "vacio", "Pronto subiremos las fotos de esta categoría. Escríbenos y te mostramos las opciones."));
  }
}

function mostrar() {
  const id = location.hash.replace("#", "");
  const c = CATEGORIAS.find((x) => x.id === id);
  if (c) categoria(c); else portada();
  $("flotante").href = linkWhatsApp(c ? mensajeCategoria(c) : MENSAJE_GENERAL);
  window.scrollTo(0, 0);
}

function iniciar() {
  document.title = NEGOCIO.nombre;
  $("nombre").textContent = NEGOCIO.nombre;
  $("eslogan").textContent = NEGOCIO.eslogan;
  $("pie").textContent = NEGOCIO.pie;

  const logo = $("logo");
  if (NEGOCIO.logo) {
    const img = document.createElement("img");
    img.src = NEGOCIO.logo; img.alt = "Logo de " + NEGOCIO.nombre;
    img.onerror = () => { logo.innerHTML = FLOR; };
    logo.appendChild(img);
  } else {
    logo.innerHTML = FLOR;
  }

  $("cerrar").addEventListener("click", cerrarVisor);
  $("visor").addEventListener("click", (e) => { if (e.target === $("visor")) cerrarVisor(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("visor").hidden) cerrarVisor(); });

  window.addEventListener("hashchange", mostrar);
  mostrar();
}
iniciar();
</script>

</body>
</html>
